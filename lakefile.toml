name = "mtg"
version = "0.1.0"
defaultTargets = ["Mtg.Engine", "MtgDemo", "mtg-demo"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "Mtg.Engine"

[[lean_lib]]
name = "MtgDemo"
roots = ["Mtg.Demo.WelcomeDecks", "Mtg.Demo.DeckList", "Mtg.Demo.Render", "Mtg.Demo.RenderTests"]
globs = ["Mtg.Demo.*"]

[[lean_exe]]
name = "mtg-demo"
root = "Mtg.Demo"
