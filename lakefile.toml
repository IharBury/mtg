name = "mtg"
version = "0.1.0"
defaultTargets = ["Mtg.Engine", "MtgDemo", "mtg-demo"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "Mtg.Engine"

# One shared plugin for the card model and the Oracle parser. Downstream
# modules load this library once, so `#guard` calls compiled `parseOracleCard`
# without loading a dynlib per engine module.
[[lean_lib]]
name = "Mtg.Engine.Card"
precompileModules = true
globs = ["Mtg.Engine.Card.*", "Mtg.Engine.Color", "Mtg.Engine.Mana", "Mtg.Engine.TypeLine"]

# Constructors (`card`, `creature`, ...) are native. The big catalog modules stay
# interpreted so loading this plugin does not parse every printed card.
[[lean_lib]]
name = "Mtg.Engine.Catalog"
precompileModules = true
globs = ["Mtg.Engine.Catalog"]

# The rules engine is one plugin, so `#guard` runs compiled game code.
# Catalog card bodies stay out of this library.
[[lean_lib]]
name = "Mtg.Engine.Game"
precompileModules = true
globs = [
  "Mtg.Engine.Game.*",
  "Mtg.Engine.Deck",
  "Mtg.Engine.Rng",
  "Mtg.Engine.Rules",
  "Mtg.Engine.Turn",
  "Mtg.Engine.Zone",
]

[[lean_lib]]
name = "MtgDemo"
roots = ["Mtg.Demo.WelcomeDecks", "Mtg.Demo.DeckList", "Mtg.Demo.Render", "Mtg.Demo.RenderTests"]
globs = ["Mtg.Demo.*"]

[[lean_exe]]
name = "mtg-demo"
root = "Mtg.Demo"

[[lean_exe]]
name = "oracle-roundtrip"
root = "Mtg.OracleRoundtrip"
