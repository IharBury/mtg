name = "mtg"
version = "0.1.0"
defaultTargets = ["Mtg.Engine", "MtgDemo", "mtg-demo"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "Mtg.Engine"
# Ruling suites stay off the `Mtg.Engine` import chain so the demo does not
# wait for them. `lake build` still compiles them as library roots.
roots = ["Mtg.Engine", "Mtg.Engine.OracleRulings.RulingTests", "Mtg.Engine.OracleRulings.MshRulingTests"]

[[lean_lib]]
name = "MtgDemo"
roots = ["Mtg.Demo.WelcomeDecks", "Mtg.Demo.DeckList", "Mtg.Demo.Render", "Mtg.Demo.RenderTests"]
globs = ["Mtg.Demo.*"]

[[lean_exe]]
name = "mtg-demo"
root = "Mtg.Demo"
