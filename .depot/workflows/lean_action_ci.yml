# Depot CI Migration
# Source: .github/workflows/lean_action_ci.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

name: Lean Action CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Restore elan toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lake build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
            lake-${{ runner.os }}-${{ runner.arch }}-
      - uses: leanprover/lean-action@v1
        with:
          # Fail if Lean or Lake logs any warning (e.g. deprecations).
          build-args: "--wfail"
          use-github-cache: false
      - name: Save Lake build cache
        if: github.ref == 'refs/heads/main' && success()
        uses: actions/cache/save@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
      - name: Check example games
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(examples/*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No example game files found in examples/"
            exit 1
          fi
          demo=.lake/build/bin/mtg-demo
          if [[ ! -x "$demo" ]]; then
            echo "Built demo not found at $demo"
            exit 1
          fi
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          pids=()
          for f in "${files[@]}"; do
            name=$(basename "$f")
            (
              echo "Checking $f"
              if ! "$demo" --check --input "$f"; then
                echo "FAIL: $f is not a valid complete game"
                exit 1
              fi
            ) >"$tmp/$name.log" 2>&1 &
            pids+=($!)
          done
          status=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              status=1
            fi
          done
          for f in "${files[@]}"; do
            cat "$tmp/$(basename "$f").log"
          done
          exit "$status"
