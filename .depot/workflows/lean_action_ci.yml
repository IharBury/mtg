# Depot CI Migration
# Source: .github/workflows/lean_action_ci.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

name: Lean Action CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          # Fail if Lean or Lake logs any warning (e.g. deprecations).
          build-args: "--wfail"
      - name: Check example games
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(examples/*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No example game files found in examples/"
            exit 1
          fi
          status=0
          for f in "${files[@]}"; do
            echo "Checking $f"
            if ! lake exe mtg-demo -- --check --input "$f"; then
              echo "FAIL: $f is not a valid complete game"
              status=1
            fi
          done
          exit "$status"
