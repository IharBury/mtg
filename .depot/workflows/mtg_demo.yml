# Depot CI Migration
# Source: .github/workflows/mtg_demo.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

name: Mtg Demo
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  demo:
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Restore elan toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Restore Lake build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
            lake-${{ runner.os }}-${{ runner.arch }}-
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
      - name: Run demo
        run: lake exe mtg-demo -- --auto 2>&1 | tee mtg-demo.log
      - name: Upload demo log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mtg-demo-log
          path: mtg-demo.log
