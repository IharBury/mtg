# Depot CI Migration
# Source: .github/workflows/mtg_demo.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

name: Mtg Demo
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  demo:
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Restore elan toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - uses: leanprover/lean-action@v1
      - name: Run demo
        run: lake exe mtg-demo -- --auto 2>&1 | tee mtg-demo.log
      - name: Upload demo log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mtg-demo-log
          path: mtg-demo.log
