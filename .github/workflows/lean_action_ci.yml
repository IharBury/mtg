name: Lean Action CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per PR (or ref). Cancel superseded PR work; keep main runs so their
# Lake cache is saved for later jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # `panic!` during elaboration is an information diagnostic unless this
      # is set, so a panicking test module would still let `lake build` exit 0.
      LEAN_ABORT_ON_PANIC: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Restore elan toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}

      - name: Restore Lake build cache
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-

      - uses: leanprover/lean-action@v1
        with:
          # Install the toolchain only. The build step below fails the job
          # when a runtime panic is logged as an information diagnostic.
          build: "false"
          use-github-cache: "false"

      - name: Build
        # `--wfail` fails the build on warnings (for example deprecations).
        # The script also fails when Lean logs a runtime panic.
        run: bash scripts/ci-lake-build.sh --wfail

      - name: Check Oracle parsing
        run: .lake/build/bin/oracle-roundtrip

      - name: Check example games
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(examples/*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No example game files found in examples/"
            exit 1
          fi
          demo=.lake/build/bin/mtg-demo
          if [[ ! -x "$demo" ]]; then
            echo "Built demo not found at $demo"
            exit 1
          fi
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          pids=()
          for f in "${files[@]}"; do
            name=$(basename "$f")
            (
              echo "Checking $f"
              if ! "$demo" --check --input "$f"; then
                echo "FAIL: $f is not a valid complete game"
                exit 1
              fi
            ) >"$tmp/$name.log" 2>&1 &
            pids+=($!)
          done
          status=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              status=1
            fi
          done
          for f in "${files[@]}"; do
            cat "$tmp/$(basename "$f").log"
          done
          exit "$status"
